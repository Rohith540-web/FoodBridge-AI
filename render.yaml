services:
  - type: web
    name: foodbridge-ai
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn foodbridge_project.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodbridge-db
          property: connectionString

databases:
  - name: foodbridge-db
    plan: free
